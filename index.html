<!DOCTYPE html>
<html lang="en" class="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Global FX - Real-Time Currency Exchange</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
    <!-- Lucide Icons -->
    <script src="https://unpkg.com/lucide@latest"></script>
    <style>
        .glass-panel {
            background: rgba(15, 23, 42, 0.75);
            backdrop-filter: blur(16px);
            border: 1px solid rgba(255, 255, 255, 0.08);
        }
    </style>
</head>
<body class="bg-slate-950 text-slate-100 font-sans min-h-screen antialiased flex flex-col justify-between selection:bg-cyan-500 selection:text-black">

    <!-- HEADER -->
    <header class="h-20 glass-panel border-b border-slate-800/80 flex items-center justify-between px-6 md:px-12 sticky top-0 z-50">
        <div class="flex items-center gap-3">
            <div class="w-10 h-10 rounded-xl bg-gradient-to-tr from-cyan-500 to-emerald-500 flex items-center justify-center shadow-lg shadow-cyan-500/20">
                <i data-lucide="arrow-left-right" class="w-6 h-6 text-slate-950"></i>
            </div>
            <div>
                <h1 class="font-bold text-lg tracking-wide text-white">Global<span class="text-cyan-400">FX</span></h1>
                <p class="text-xs text-slate-400" data-i18n="subtitle">Live API Exchange Hub</p>
            </div>
        </div>

        <div class="flex items-center gap-4">
            <!-- BOTÃO IDIOMA (PT/EN) -->
            <button onclick="toggleLanguage()" class="flex items-center gap-2 px-3 py-2 rounded-xl bg-slate-900 border border-slate-800 hover:border-cyan-500/50 text-xs font-semibold text-slate-300 transition-all">
                <i data-lucide="globe" class="w-4 h-4 text-cyan-400"></i>
                <span id="langLabel">PT / EN</span>
            </button>
        </div>
    </header>

    <!-- MAIN CONTAINER -->
    <main class="flex-1 max-w-4xl w-full mx-auto p-6 md:p-12 flex flex-col justify-center">
        
        <div class="text-center mb-10">
            <h2 class="text-3xl md:text-5xl font-extrabold text-white tracking-tight" data-i18n="main_title">
                Real-Time <span class="bg-gradient-to-r from-cyan-400 to-emerald-400 bg-clip-text text-transparent">Currency Converter</span>
            </h2>
            <p class="text-slate-400 mt-3 text-sm md:text-base max-w-lg mx-auto" data-i18n="main_sub">
                Live exchange rates powered by public financial APIs with instant conversion calculations.
            </p>
        </div>

        <!-- CONVERTER CARD -->
        <div class="glass-panel p-8 rounded-3xl border border-slate-800 shadow-2xl relative">
            <div class="grid grid-cols-1 md:grid-cols-5 gap-4 items-center">
                
                <!-- AMOUNT & FROM -->
                <div class="md:col-span-2 space-y-2">
                    <label class="text-xs uppercase tracking-wider text-slate-400 font-semibold" data-i18n="lbl_amount">Amount</label>
                    <div class="relative">
                        <input type="number" id="amountInput" value="100" min="0.01" step="any" oninput="convertCurrency()"
                            class="w-full bg-slate-900 border border-slate-800 rounded-2xl px-4 py-3.5 text-lg font-bold text-white focus:outline-none focus:border-cyan-500 transition-all">
                    </div>
                    <div class="mt-2">
                        <select id="fromCurrency" onchange="convertCurrency()" class="w-full bg-slate-900 border border-slate-800 rounded-xl px-3 py-2.5 text-sm text-slate-200 focus:outline-none focus:border-cyan-500">
                            <option value="USD">USD - US Dollar ($)</option>
                            <option value="EUR">EUR - Euro (€)</option>
                            <option value="BRL" selected>BRL - Brazilian Real (R$)</option>
                            <option value="GBP">GBP - British Pound (£)</option>
                            <option value="CAD">CAD - Canadian Dollar ($)</option>
                            <option value="JPY">JPY - Japanese Yen (¥)</option>
                        </select>
                    </div>
                </div>

                <!-- SWAP BUTTON -->
                <div class="flex justify-center md:col-span-1 py-2">
                    <button onclick="swapCurrencies()" class="p-3.5 rounded-2xl bg-slate-900 hover:bg-slate-800 border border-slate-800 hover:border-cyan-500/50 text-cyan-400 transition-all shadow-md">
                        <i data-lucide="repeat" class="w-5 h-5"></i>
                    </button>
                </div>

                <!-- TO CURRENCY -->
                <div class="md:col-span-2 space-y-2">
                    <label class="text-xs uppercase tracking-wider text-slate-400 font-semibold" data-i18n="lbl_converted">Converted Result</label>
                    <div class="bg-slate-900/60 border border-slate-800 rounded-2xl px-4 py-3.5 flex items-center justify-between">
                        <span id="convertedResult" class="text-2xl font-extrabold text-cyan-400">---</span>
                        <span id="loadingSpinner" class="hidden animate-spin text-cyan-400"><i data-lucide="loader-2" class="w-5 h-5"></i></span>
                    </div>
                    <div class="mt-2">
                        <select id="toCurrency" onchange="convertCurrency()" class="w-full bg-slate-900 border border-slate-800 rounded-xl px-3 py-2.5 text-sm text-slate-200 focus:outline-none focus:border-cyan-500">
                            <option value="USD" selected>USD - US Dollar ($)</option>
                            <option value="EUR">EUR - Euro (€)</option>
                            <option value="BRL">BRL - Brazilian Real (R$)</option>
                            <option value="GBP">GBP - British Pound (£)</option>
                            <option value="CAD">CAD - Canadian Dollar ($)</option>
                            <option value="JPY">JPY - Japanese Yen (¥)</option>
                        </select>
                    </div>
                </div>
            </div>

            <!-- RATE FOOTER INFO -->
            <div class="mt-8 pt-6 border-t border-slate-800/80 flex flex-col sm:flex-row justify-between items-center text-xs text-slate-400 gap-2">
                <span id="exchangeRateInfo" data-i18n="fetching">Fetching exchange rates...</span>
                <span class="font-mono text-slate-500" id="lastUpdated" data-i18n="live_status">Live API Stream</span>
            </div>
        </div>
    </main>

    <!-- FOOTER -->
    <footer class="border-t border-slate-800/80 py-6 text-center text-xs text-slate-500">
        <p>© 2026 GlobalFX API Hub. Engineered by Andréia Antunes.</p>
    </footer>

    <!-- JAVASCRIPT & API LOGIC -->
    <script>
        lucide.createIcons();

        const translations = {
            en: {
                subtitle: "Live API Exchange Hub",
                main_title: "Real-Time Currency Converter",
                main_sub: "Live exchange rates powered by public financial APIs with instant conversion calculations.",
                lbl_amount: "Amount",
                lbl_converted: "Converted Result",
                fetching: "Fetching exchange rates...",
                live_status: "Live API Stream"
            },
            pt: {
                subtitle: "Hub de Câmbio com API ao Vivo",
                main_title: "Conversor de Moedas em Tempo Real",
                main_sub: "Taxas de câmbio ao vivo conectadas a APIs financeiras públicas com cálculo instantâneo.",
                lbl_amount: "Valor",
                lbl_converted: "Resultado Convertido",
                fetching: "Buscando taxas de câmbio...",
                live_status: "Fluxo de API ao Vivo"
            }
        };

        let currentLang = 'en';

        function toggleLanguage() {
            currentLang = currentLang === 'en' ? 'pt' : 'en';
            document.getElementById('langLabel').innerText = currentLang === 'en' ? 'PT / EN' : 'EN / PT';
            
            document.querySelectorAll('[data-i18n]').forEach(el => {
                const key = el.getAttribute('data-i18n');
                if (translations[currentLang][key]) {
                    el.innerText = translations[currentLang][key];
                }
            });
            convertCurrency();
        }

        async function convertCurrency() {
            const amount = parseFloat(document.getElementById('amountInput').value);
            const from = document.getElementById('fromCurrency').value;
            const to = document.getElementById('toCurrency').value;
            const resultEl = document.getElementById('convertedResult');
            const rateInfoEl = document.getElementById('exchangeRateInfo');
            const spinner = document.getElementById('loadingSpinner');

            if (isNaN(amount) || amount <= 0) {
                resultEl.innerText = "0.00";
                return;
            }

            spinner.classList.remove('hidden');

            try {
                const response = await fetch(`https://open.er-api.com/v6/latest/${from}`);
                const data = await response.json();

                if (data.result === "success") {
                    const rate = data.rates[to];
                    const converted = (amount * rate).toFixed(2);
                    
                    resultEl.innerText = `${to} ${converted}`;
                    rateInfoEl.innerText = `1 ${from} = ${rate.toFixed(4)} ${to}`;
                } else {
                    resultEl.innerText = "Error";
                    rateInfoEl.innerText = "API error occurred.";
                }
            } catch (err) {
                resultEl.innerText = "Error";
                rateInfoEl.innerText = "Failed to connect to API.";
            } finally {
                spinner.classList.add('hidden');
            }
        }

        function swapCurrencies() {
            const from = document.getElementById('fromCurrency');
            const to = document.getElementById('toCurrency');
            const temp = from.value;
            from.value = to.value;
            to.value = temp;
            convertCurrency();
        }

        convertCurrency();
    </script>
</body>
</html>
